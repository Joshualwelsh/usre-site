<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Allura&display=swap');
#usre-agent{--nd:#0F2347;--nv:#1a2f4e;--gd:#c9a84c;--gdk:#B8913A;--gdl:#f6efdc;--ow:#f7f8fa;--br:#e4e7ec;--tx:#1f2937;--mu:#5b6675;
  font-family:'Inter',Arial,sans-serif;color:var(--tx);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
#usre-agent .us-main p+p{margin-top:0}
#usre-agent .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
#usre-agent .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--gd);color:var(--nd);font-weight:700;font-size:16px;text-decoration:none;padding:16px 30px;border-radius:999px;transition:transform .15s,box-shadow .15s}
#usre-agent .btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(201,168,76,.35)}
#usre-agent h2{font-family:'Inter',Arial,sans-serif;font-weight:800;letter-spacing:-.6px;font-size:34px;line-height:1.18;color:var(--nd);margin-bottom:16px}
#usre-agent .ey{display:block;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gdk);margin-bottom:10px}
#usre-agent section{padding:72px 0}
#usre-agent .alt{background:var(--ow)}
/* hero */
#usre-agent .hero{background:var(--nd);color:#fff;padding:64px 0;border-bottom:2px solid var(--gdk)}
#usre-agent .hero .wrap{display:grid;grid-template-columns:300px 1fr;gap:48px;align-items:center}
#usre-agent .ph{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--nv),#0a1830);border:3px solid var(--gd);display:flex;align-items:center;justify-content:center}
#usre-agent .ph img{width:100%;height:100%;object-fit:cover;display:block}
#usre-agent .ph svg{width:45%;color:rgba(201,168,76,.55)}
#usre-agent .hero .ey{color:var(--gd)}
#usre-agent .hero h1{font-family:'Inter',Arial,sans-serif;font-size:48px;line-height:1.08;margin-bottom:8px;color:#fff;letter-spacing:-1.2px;font-weight:800}
#usre-agent .hero .ti{font-size:17px;color:var(--gd);font-weight:600;margin-bottom:18px}
#usre-agent .hero .hl{font-size:19px;color:#d5dbe5;max-width:560px;margin-bottom:28px}
#usre-agent .creds{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
#usre-agent .creds span{font-size:13px;font-weight:600;color:#fff;border:1px solid rgba(201,168,76,.5);border-radius:999px;padding:7px 14px}
/* badges */
#usre-agent .badges{padding:56px 0 48px;text-align:center}
#usre-agent .bgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 18px;margin-top:26px}
#usre-agent .bd{width:116px;display:flex;flex-direction:column;align-items:center;gap:8px}
#usre-agent .bd svg{width:92px;height:92px;filter:drop-shadow(0 4px 10px rgba(15,35,71,.18))}
#usre-agent .bd span{font-size:12px;font-weight:600;color:var(--mu);line-height:1.3}
@media(max-width:600px){#usre-agent .bd{width:100px}#usre-agent .bd svg{width:76px;height:76px}}
/* stats */
#usre-agent .stats{background:var(--nv);padding:30px 0}
#usre-agent .stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}
#usre-agent .stats b{display:block;font-size:28px;font-weight:800;color:#fff}
#usre-agent .stats span{font-size:14px;color:#b8c2d1}
/* video */
#usre-agent .vid{max-width:820px;margin:0 auto;text-align:center}
#usre-agent .vf{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--nd);box-shadow:0 24px 60px rgba(15,30,51,.18);margin-top:24px}
#usre-agent .vf iframe,#usre-agent .vf video{position:absolute;inset:0;width:100%;height:100%;border:0}
#usre-agent .vf .vp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b8c2d1;gap:12px;font-size:15px}
#usre-agent .vf .vp i{width:72px;height:72px;border-radius:50%;background:var(--gd);display:flex;align-items:center;justify-content:center}
/* story */
#usre-agent .story{display:grid;grid-template-columns:1fr 1.4fr;gap:56px;align-items:start}
#usre-agent .story blockquote{font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.45;color:var(--nd);border-left:4px solid var(--gd);padding-left:22px}
#usre-agent .story .tx p{font-size:17px;color:#374151;margin-bottom:16px}
/* help */
#usre-agent .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:28px}
#usre-agent .card{background:#fff;border:1px solid var(--br);border-radius:18px;padding:28px;border-top:3px solid var(--gd)}
#usre-agent .card h3{font-size:18px;color:var(--nd);margin-bottom:8px}
#usre-agent .card p{font-size:15px;color:var(--mu)}
/* testimonials */
#usre-agent .tq{background:#fff;border:1px solid var(--br);border-radius:18px;padding:28px}
#usre-agent .tq p{font-family:Georgia,'Times New Roman',serif;font-size:18px;color:var(--nd);margin-bottom:14px}
#usre-agent .tq b{font-size:14px;color:var(--gdk)}
/* expect */
#usre-agent .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:28px}
#usre-agent .step .n{width:36px;height:36px;border-radius:50%;background:var(--gd);color:var(--nd);font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
#usre-agent .step h3{font-size:18px;color:var(--nd);margin-bottom:6px}
#usre-agent .step p{font-size:15px;color:var(--mu)}
/* hero actions */
#usre-agent .acts{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
#usre-agent .lnk{color:#fff;font-weight:600;font-size:15px;text-decoration:none;border-bottom:1px solid rgba(201,168,76,.7);padding-bottom:2px}
/* letter */
#usre-agent .letter{display:grid;grid-template-columns:320px 1fr;gap:48px;align-items:start}
#usre-agent .letter .lp{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--nv),#0a1830);display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(15,30,51,.16)}
#usre-agent .letter .lp img{width:100%;height:100%;object-fit:cover}
#usre-agent .letter .lp svg{width:45%;color:rgba(201,168,76,.55)}
#usre-agent .paper{background:#fff;border:1px solid var(--br);border-top:4px solid var(--gd);border-radius:6px 6px 18px 18px;padding:40px 44px;box-shadow:0 18px 50px rgba(15,30,51,.08)}
#usre-agent .paper p{font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.7;color:#2b3443;margin-bottom:16px}
#usre-agent .sig{font-family:'Allura',cursive;font-size:44px;color:var(--nd);line-height:1;margin-top:18px}
#usre-agent .sigt{font-size:13px;color:var(--mu);margin-top:6px}
/* reasons */
#usre-agent .reasons{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:28px}
#usre-agent .rs{padding:28px;border-radius:18px;background:#fff;border:1px solid var(--br)}
#usre-agent .rs .rn{font-family:Georgia,serif;font-size:34px;color:var(--gd);line-height:1;margin-bottom:12px}
#usre-agent .rs h3{font-size:18px;color:var(--nd);margin-bottom:8px}
#usre-agent .rs p{font-size:15px;color:var(--mu)}
/* prep */
#usre-agent .prep{margin-top:36px;background:#fff;border:1px solid var(--br);border-radius:18px;padding:26px 30px}
#usre-agent .prep h3{font-size:17px;color:var(--nd);margin-bottom:12px}
#usre-agent .prep ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 28px}
#usre-agent .prep li{font-size:15px;color:#374151;padding-left:26px;position:relative}
#usre-agent .prep li:before{content:'';position:absolute;left:0;top:5px;width:14px;height:8px;border-left:2px solid var(--gdk);border-bottom:2px solid var(--gdk);transform:rotate(-45deg)}
/* personal */
#usre-agent .pers{max-width:760px;margin:0 auto;text-align:center}
#usre-agent .pers p{font-size:17px;color:#374151;margin-bottom:14px}
#usre-agent .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
#usre-agent .tags span{font-size:14px;font-weight:600;color:var(--nd);background:var(--gdl);border-radius:999px;padding:8px 16px}
#usre-agent .final .sig{color:var(--gd);margin:6px 0 24px}
#usre-agent .final small{display:block;margin-top:18px;color:#97a3b6;font-size:14px}
/* final */
#usre-agent .final{background:var(--nd);color:#fff;text-align:center}
#usre-agent .final h2{color:#fff}
#usre-agent .final p{color:#b8c2d1;font-size:18px;max-width:600px;margin:0 auto 28px}
#usre-agent .disc{font-size:12px;color:var(--mu);padding:28px 0;line-height:1.6}
@media(max-width:900px){
  #usre-agent .hero .wrap{grid-template-columns:1fr;gap:32px;text-align:center}
  #usre-agent .ph{max-width:260px;margin:0 auto}
  #usre-agent .hero .hl{margin-left:auto;margin-right:auto}
  #usre-agent .creds{justify-content:center}
  #usre-agent .stats .wrap{grid-template-columns:repeat(2,1fr)}
  #usre-agent .story{grid-template-columns:1fr;gap:28px}
  #usre-agent .cards,#usre-agent .steps,#usre-agent .reasons{grid-template-columns:1fr}
  #usre-agent .letter{grid-template-columns:1fr;gap:28px}
  #usre-agent .letter .lp{max-width:300px;margin:0 auto;width:100%}
  #usre-agent .acts{justify-content:center}
}
@media(max-width:600px){
  #usre-agent .hero h1{font-size:34px}
  #usre-agent h2{font-size:26px}
  #usre-agent section{padding:52px 0}
  #usre-agent .btn{width:100%}
  #usre-agent .paper{padding:28px 22px}
  #usre-agent .paper p{font-size:17px}
  #usre-agent .prep ul{grid-template-columns:1fr}
}
</style>
