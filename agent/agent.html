<!--@site-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Allura&display=swap');
#usre-agent{--nd:#0F2347;--nv:#1a2f4e;--gd:#c9a84c;--gdk:#B8913A;--gdl:#f6efdc;--ow:#f7f8fa;--br:#e4e7ec;--tx:#1f2937;--mu:#5b6675;
  font-family:'Inter',Arial,sans-serif;color:var(--tx);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
#usre-agent .us-main p+p{margin-top:0}
#usre-agent .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
#usre-agent .btn{display:inline-flex;align-items:center;justify-content:center;background:var(--gd);color:var(--nd);font-weight:700;font-size:16px;text-decoration:none;padding:16px 30px;border-radius:999px;transition:transform .15s,box-shadow .15s}
#usre-agent .btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(201,168,76,.35)}
#usre-agent h2{font-family:'Inter',Arial,sans-serif;font-weight:800;letter-spacing:-.6px;font-size:34px;line-height:1.18;color:var(--nd);margin-bottom:16px}
#usre-agent .ey{display:block;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gdk);margin-bottom:10px}
#usre-agent section{padding:72px 0}
#usre-agent .alt{background:var(--ow)}
/* hero */
#usre-agent .hero{background:var(--nd);color:#fff;padding:64px 0;border-bottom:2px solid var(--gdk)}
#usre-agent .hero .wrap{display:grid;grid-template-columns:300px 1fr;gap:48px;align-items:center}
#usre-agent .ph{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--nv),#0a1830);border:3px solid var(--gd);display:flex;align-items:center;justify-content:center}
#usre-agent .ph img{width:100%;height:100%;object-fit:cover;display:block}
#usre-agent .ph svg{width:45%;color:rgba(201,168,76,.55)}
#usre-agent .hero .ey{color:var(--gd)}
#usre-agent .hero h1{font-family:'Inter',Arial,sans-serif;font-size:48px;line-height:1.08;margin-bottom:8px;color:#fff;letter-spacing:-1.2px;font-weight:800}
#usre-agent .hero .ti{font-size:17px;color:var(--gd);font-weight:600;margin-bottom:18px}
#usre-agent .hero .hl{font-size:19px;color:#d5dbe5;max-width:560px;margin-bottom:28px}
#usre-agent .creds{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
#usre-agent .creds span{font-size:13px;font-weight:600;color:#fff;border:1px solid rgba(201,168,76,.5);border-radius:999px;padding:7px 14px}
/* badges */
#usre-agent .badges{padding:56px 0 48px;text-align:center}
#usre-agent .bgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:24px 18px;margin-top:26px}
#usre-agent .bd{width:104px;display:flex;flex-direction:column;align-items:center;gap:8px}
#usre-agent .bd svg{width:76px;height:76px;filter:drop-shadow(0 4px 10px rgba(15,35,71,.18))}
#usre-agent .bd span{font-size:12px;font-weight:600;color:var(--mu);line-height:1.3}
@media(max-width:600px){#usre-agent .bd{width:92px}#usre-agent .bd svg{width:64px;height:64px}}
/* stats */
#usre-agent .stats{background:var(--nv);padding:30px 0}
#usre-agent .stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;text-align:center}
#usre-agent .stats b{display:block;font-size:28px;font-weight:800;color:#fff}
#usre-agent .stats span{font-size:14px;color:#b8c2d1}
/* video */
#usre-agent .vid{max-width:820px;margin:0 auto;text-align:center}
#usre-agent .vf{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:var(--nd);box-shadow:0 24px 60px rgba(15,30,51,.18);margin-top:24px}
#usre-agent .vf iframe,#usre-agent .vf video{position:absolute;inset:0;width:100%;height:100%;border:0}
#usre-agent .vf .vp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b8c2d1;gap:12px;font-size:15px}
#usre-agent .vf .vp i{width:72px;height:72px;border-radius:50%;background:var(--gd);display:flex;align-items:center;justify-content:center}
/* story */
#usre-agent .story{display:grid;grid-template-columns:1fr 1.4fr;gap:56px;align-items:start}
#usre-agent .story blockquote{font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:1.45;color:var(--nd);border-left:4px solid var(--gd);padding-left:22px}
#usre-agent .story .tx p{font-size:17px;color:#374151;margin-bottom:16px}
/* help */
#usre-agent .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:28px}
#usre-agent .card{background:#fff;border:1px solid var(--br);border-radius:18px;padding:28px;border-top:3px solid var(--gd)}
#usre-agent .card h3{font-size:18px;color:var(--nd);margin-bottom:8px}
#usre-agent .card p{font-size:15px;color:var(--mu)}
/* testimonials */
#usre-agent .tq{background:#fff;border:1px solid var(--br);border-radius:18px;padding:28px}
#usre-agent .tq p{font-family:Georgia,'Times New Roman',serif;font-size:18px;color:var(--nd);margin-bottom:14px}
#usre-agent .tq b{font-size:14px;color:var(--gdk)}
/* expect */
#usre-agent .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:28px}
#usre-agent .step .n{width:36px;height:36px;border-radius:50%;background:var(--gd);color:var(--nd);font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
#usre-agent .step h3{font-size:18px;color:var(--nd);margin-bottom:6px}
#usre-agent .step p{font-size:15px;color:var(--mu)}
/* hero actions */
#usre-agent .acts{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
#usre-agent .lnk{color:#fff;font-weight:600;font-size:15px;text-decoration:none;border-bottom:1px solid rgba(201,168,76,.7);padding-bottom:2px}
/* letter */
#usre-agent .letter{display:grid;grid-template-columns:320px 1fr;gap:48px;align-items:start}
#usre-agent .letter .lp{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--nv),#0a1830);display:flex;align-items:center;justify-content:center;box-shadow:0 24px 60px rgba(15,30,51,.16)}
#usre-agent .letter .lp img{width:100%;height:100%;object-fit:cover}
#usre-agent .letter .lp svg{width:45%;color:rgba(201,168,76,.55)}
#usre-agent .paper{background:#fff;border:1px solid var(--br);border-top:4px solid var(--gd);border-radius:6px 6px 18px 18px;padding:40px 44px;box-shadow:0 18px 50px rgba(15,30,51,.08)}
#usre-agent .paper p{font-family:Georgia,'Times New Roman',serif;font-size:18px;line-height:1.7;color:#2b3443;margin-bottom:16px}
#usre-agent .sig{font-family:'Allura',cursive;font-size:44px;color:var(--nd);line-height:1;margin-top:18px}
#usre-agent .sigt{font-size:13px;color:var(--mu);margin-top:6px}
/* reasons */
#usre-agent .reasons{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:28px}
#usre-agent .rs{padding:28px;border-radius:18px;background:#fff;border:1px solid var(--br)}
#usre-agent .rs .rn{font-family:Georgia,serif;font-size:34px;color:var(--gd);line-height:1;margin-bottom:12px}
#usre-agent .rs h3{font-size:18px;color:var(--nd);margin-bottom:8px}
#usre-agent .rs p{font-size:15px;color:var(--mu)}
/* prep */
#usre-agent .prep{margin-top:36px;background:#fff;border:1px solid var(--br);border-radius:18px;padding:26px 30px}
#usre-agent .prep h3{font-size:17px;color:var(--nd);margin-bottom:12px}
#usre-agent .prep ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 28px}
#usre-agent .prep li{font-size:15px;color:#374151;padding-left:26px;position:relative}
#usre-agent .prep li:before{content:'';position:absolute;left:0;top:5px;width:14px;height:8px;border-left:2px solid var(--gdk);border-bottom:2px solid var(--gdk);transform:rotate(-45deg)}
/* personal */
#usre-agent .pers{max-width:760px;margin:0 auto;text-align:center}
#usre-agent .pers p{font-size:17px;color:#374151;margin-bottom:14px}
#usre-agent .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
#usre-agent .tags span{font-size:14px;font-weight:600;color:var(--nd);background:var(--gdl);border-radius:999px;padding:8px 16px}
#usre-agent .final .sig{color:var(--gd);margin:6px 0 24px}
#usre-agent .final small{display:block;margin-top:18px;color:#97a3b6;font-size:14px}
/* final */
#usre-agent .final{background:var(--nd);color:#fff;text-align:center}
#usre-agent .final h2{color:#fff}
#usre-agent .final p{color:#b8c2d1;font-size:18px;max-width:600px;margin:0 auto 28px}
#usre-agent .disc{font-size:12px;color:var(--mu);padding:28px 0;line-height:1.6}
@media(max-width:900px){
  #usre-agent .hero .wrap{grid-template-columns:1fr;gap:32px;text-align:center}
  #usre-agent .ph{max-width:260px;margin:0 auto}
  #usre-agent .hero .hl{margin-left:auto;margin-right:auto}
  #usre-agent .creds{justify-content:center}
  #usre-agent .stats .wrap{grid-template-columns:repeat(2,1fr)}
  #usre-agent .story{grid-template-columns:1fr;gap:28px}
  #usre-agent .cards,#usre-agent .steps,#usre-agent .reasons{grid-template-columns:1fr}
  #usre-agent .letter{grid-template-columns:1fr;gap:28px}
  #usre-agent .letter .lp{max-width:300px;margin:0 auto;width:100%}
  #usre-agent .acts{justify-content:center}
}
@media(max-width:600px){
  #usre-agent .hero h1{font-size:34px}
  #usre-agent h2{font-size:26px}
  #usre-agent section{padding:52px 0}
  #usre-agent .btn{width:100%}
  #usre-agent .paper{padding:28px 22px}
  #usre-agent .paper p{font-size:17px}
  #usre-agent .prep ul{grid-template-columns:1fr}
}
</style>
<div id="ua-root"></div>
<script>
(function(){
  // BADGE LIBRARY. Add a badge to an agent with its key in that agent's badges list.
  // ring = text around the top, big = center text, sub = small text under it, label = caption below.
  // type sets the shape: cert = solid gold seal, license = shield, exam = hexagon, years = ring.
  var BADGES={
    cre:{type:'cert',top:'CERTIFIED',big:'CRE',label:'Certified Retirement Educator'},
    lah:{type:'license',top:'LICENSED',big:'L&H',label:'Life, Accident & Health'},
    life:{type:'license',top:'LICENSED',big:'LIFE',label:'Life Insurance'},
    allstates:{type:'license',top:'LICENSED',big:'50',label:'Licensed in All 50 States'},
    series6:{type:'exam',top:'SERIES',big:'6',label:'Series 6'},
    series63:{type:'exam',top:'SERIES',big:'63',label:'Series 63'},
    series65:{type:'exam',top:'SERIES',big:'65',label:'Series 65'},
    series66:{type:'exam',top:'SERIES',big:'66',label:'Series 66'},
    yrs5:{type:'years',top:'YEARS',big:'5+',label:'5+ Years in Business'},
    yrs10:{type:'years',top:'YEARS',big:'10+',label:'10+ Years in Business'},
    yrs15:{type:'years',top:'YEARS',big:'15+',label:'15+ Years in Business'},
    yrs20:{type:'years',top:'YEARS',big:'20+',label:'20+ Years in Business'},
    yrs25:{type:'years',top:'YEARS',big:'25+',label:'25+ Years in Business'}
  };
  var EVERY_AGENT=['cre'];          // badges every agent gets automatically

  // ONE ENTRY PER AGENT. The key must match the agent's GHL page path (e.g. /jeremy-smith -> 'jeremy-smith').
  // Every agent page uses the same embed; the path picks the agent. ?a=<key> also works.
  // TWO TEMPLATES, picked automatically: if video is set, the page shows "A message from [name]" (video).
  // If video is '', it shows "A note from [name]" (a personal letter with photo2) instead.
  // Any section whose field is empty is hidden.
  var AGENTS={
    'jeremy-smith':{
      name:'Jeremy Smith',title:'',photo:'',photo2:'',video:'',bookUrl:'',badges:[],
      headline:'',stats:[],letter:[],quote:'',story:[],reasons:[],testimonials:[],personal:[],interests:[]
    },
    'joshua-welsh':{
      name:'Joshua Welsh',title:'',photo:'',photo2:'',video:'',bookUrl:'',badges:[],
      headline:'',stats:[],letter:[],quote:'',story:[],reasons:[],testimonials:[],personal:[],interests:[]
    },
    'misty-plathe':{
      name:'Misty Plathe',title:'',photo:'',photo2:'',video:'',bookUrl:'',badges:[],
      headline:'',stats:[],letter:[],quote:'',story:[],reasons:[],testimonials:[],personal:[],interests:[]
    },
    'richard-duese':{
      name:'Richard Duese',title:'',photo:'',photo2:'',video:'',bookUrl:'',badges:[],
      headline:'',stats:[],letter:[],quote:'',story:[],reasons:[],testimonials:[],personal:[],interests:[]
    },
    'august-marcello-iii':{
      name:'August Marcello III',title:'',photo:'',photo2:'',video:'',bookUrl:'',badges:[],
      headline:'',stats:[],letter:[],quote:'',story:[],reasons:[],testimonials:[],personal:[],interests:[]
    },
    'nathan-burks':{
      name:'Nathan Burks',title:'',photo:'',photo2:'',video:'',bookUrl:'',badges:[],
      headline:'',stats:[],letter:[],quote:'',story:[],reasons:[],testimonials:[],personal:[],interests:[]
    },
    'katherine-leavitt':{
      name:'Katherine Leavitt',title:'',photo:'',photo2:'',video:'',bookUrl:'',badges:[],
      headline:'',stats:[],letter:[],quote:'',story:[],reasons:[],testimonials:[],personal:[],interests:[]
    },
    'zach-allen':{
      name:'Zach Allen',title:'',photo:'',photo2:'',video:'',bookUrl:'',badges:[],
      headline:'',stats:[],letter:[],quote:'',story:[],reasons:[],testimonials:[],personal:[],interests:[]
    },
    'charissa-lawal':{
      name:'Charissa Lawal',title:'',photo:'',photo2:'',video:'',bookUrl:'',badges:[],
      headline:'',stats:[],letter:[],quote:'',story:[],reasons:[],testimonials:[],personal:[],interests:[]
    },
    'christian-weisenburger':{
      name:'Christian Weisenburger',title:'',photo:'',photo2:'',video:'',bookUrl:'',badges:[],
      headline:'',stats:[],letter:[],quote:'',story:[],reasons:[],testimonials:[],personal:[],interests:[]
    },
    sample:{
      name:'Agent Name',
      title:'Licensed Retirement Specialist',
      photo:'',                       // headshot URL
      photo2:'',                      // second, more casual photo (used with the letter)
      video:'',                       // YouTube, Vimeo, or .mp4 link. Leave '' for the letter version.
      bookUrl:'',                     // this agent's calendar link
      headline:'I help people approaching retirement protect what they\u2019ve saved and turn it into income they can count on.',
      badges:['lah','series65','yrs10'],   // keys from BADGES above
      stats:[['[X]','years experience'],['[X]+','families helped'],['[X]','states licensed']],
      letter:['Thank you for taking the time to get to know me. I know how big these decisions feel, and I don\u2019t take your trust lightly.','My job is simple: help you understand exactly where you stand, show you your options in plain English, and make sure you feel confident about your retirement, whether or not we end up working together.','I\u2019m looking forward to talking with you.'],
      quote:'A short line in the agent\u2019s own words about why they do this work.',
      story:['Paragraph one: background and how they got into retirement planning.','Paragraph two: what drives them and who they love working with.'],
      reasons:[['I explain, I don\u2019t sell','You\u2019ll understand every option before you decide anything.'],['Your plan, not a product','I start with your goals and your numbers, then find what fits.'],['I\u2019m here for the long run','You\u2019ll have my direct line, before and after any decision.']],
      testimonials:[],                // e.g. [['Quote text','Client first name, City']]
      personal:['A short paragraph about life outside work: family, hometown, faith, what weekends look like.'],
      interests:['Family','Golf','Faith','Travel']
    }
  };
  var DEFAULT_BOOK='';               // fallback calendar link if an agent has none
  var AGENT_DEFAULT='sample';

  var q=(location.search.match(/[?&]a=([^&]+)/)||[])[1]||location.pathname.replace(/\/+$/,'').split('/').pop();
  var a=AGENTS[decodeURIComponent(q||'').toLowerCase()]||AGENTS[AGENT_DEFAULT];
  function e(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var first=e(a.name.split(' ')[0]);
  var book=a.bookUrl||DEFAULT_BOOK||'#';
  var person='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.9-4.4 4.3-7 8.5-7s7.6 2.6 8.5 7z"/></svg>';
  function video(u){
    if(!u)return '<div class="vp"><i><svg width="26" height="26" viewBox="0 0 24 24" fill="#0F2347"><path d="M8 5v14l11-7z"/></svg></i>Video coming soon</div>';
    var m=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
    if(m)return '<iframe src="https://www.youtube.com/embed/'+m[1]+'?rel=0" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen title="Video"></iframe>';
    m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
    if(m)return '<iframe src="https://player.vimeo.com/video/'+m[1]+'" allow="fullscreen; picture-in-picture" allowfullscreen title="Video"></iframe>';
    return '<video src="'+e(u)+'" controls playsinline preload="metadata"></video>';
  }
  var SHAPES={
    cert:'<circle cx="40" cy="40" r="38" fill="#c9a84c"/><circle cx="40" cy="40" r="33" fill="none" stroke="#0F2347" stroke-width="1.2" opacity=".55"/>',
    license:'<path d="M40 3l32 10v24c0 20-14 33-32 40C22 70 8 57 8 37V13z" fill="#0F2347" stroke="#c9a84c" stroke-width="2.5"/>',
    exam:'<path d="M40 3l32 18.5v37L40 77 8 58.5v-37z" fill="#0F2347" stroke="#c9a84c" stroke-width="2.5"/>',
    years:'<circle cx="40" cy="40" r="37" fill="#0F2347" stroke="#c9a84c" stroke-width="2.5"/><circle cx="40" cy="40" r="31" fill="none" stroke="#c9a84c" stroke-width=".8" opacity=".6"/>'
  };
  function badge(b){
    var big=e(b.big),gold=b.type==='cert',ink=gold?'#0F2347':'#fff',acc=gold?'#0F2347':'#c9a84c';
    var fs=big.length>=4?16:big.length===3?20:26,y=b.type==='license'?47:49;
    return '<div class="bd"><svg viewBox="0 0 80 80" role="img" aria-label="'+e(b.label)+'">'+(SHAPES[b.type]||SHAPES.years)+
      '<text x="40" y="'+(y-(fs>=26?22:19))+'" font-family="Inter,Arial,sans-serif" font-size="6.5" font-weight="700" letter-spacing="1.4" fill="'+acc+'" text-anchor="middle">'+e(b.top)+'</text>'+
      '<text x="40" y="'+y+'" font-family="Georgia,serif" font-size="'+fs+'" font-weight="700" fill="'+ink+'" text-anchor="middle">'+big+'</text>'+
      '<path d="M32 '+(y+8)+'h16" stroke="'+acc+'" stroke-width="1.2"/>'+
      '</svg><span>'+e(b.label)+'</span></div>';
  }
  var h='',hasVid=!!a.video,hasLetter=!!(a.letter&&a.letter.length);
  var msg=hasVid?'Watch '+first+'\u2019s message':hasLetter?'Read '+first+'\u2019s note':'';
  h+='<div class="hero"><div class="wrap"><div class="ph">'+(a.photo?'<img src="'+e(a.photo)+'" alt="'+e(a.name)+'">':person)+'</div><div>'+
     '<span class="ey">US Retirement Educators</span><h1>'+e(a.name)+'</h1>'+(a.title?'<div class="ti">'+e(a.title)+'</div>':'')+
     (a.headline?'<p class="hl">'+e(a.headline)+'</p>':'')+
     '<div class="acts">'+(msg?'<a class="btn" href="#ua-msg">'+msg+'</a>':'')+'<a class="'+(msg?'lnk':'btn')+'" href="'+e(book)+'">Schedule a call with '+first+'</a></div>'+
     '</div></div></div>';
  if(a.stats&&a.stats.length)h+='<div class="stats"><div class="wrap" style="grid-template-columns:repeat('+Math.min(a.stats.length,4)+',1fr)">'+a.stats.map(function(s){return '<div><b>'+e(s[0])+'</b><span>'+e(s[1])+'</span></div>';}).join('')+'</div></div>';
  var bk=EVERY_AGENT.concat((a.badges||[]).filter(function(k){return EVERY_AGENT.indexOf(k)<0;})).filter(function(k){return BADGES[k];});
  if(bk.length)h+='<section class="badges"><div class="wrap"><span class="ey">Credentials &amp; Accolades</span><h2>Licensed, certified, and experienced</h2><div class="bgrid">'+bk.map(function(k){return badge(BADGES[k]);}).join('')+'</div></div></section>';
  if(hasVid)h+='<section class="alt" id="ua-msg"><div class="wrap vid"><span class="ey">A Message From '+first+'</span><h2>Get to know me</h2><div class="vf">'+video(a.video)+'</div></div></section>';
  else if(hasLetter){var p2=a.photo2||a.photo;
    h+='<section class="alt" id="ua-msg"><div class="wrap letter"><div class="lp">'+(p2?'<img src="'+e(p2)+'" alt="'+e(a.name)+'">':person)+'</div><div><span class="ey">A Note From '+first+'</span><div class="paper">'+
       a.letter.map(function(p){return '<p>'+e(p)+'</p>';}).join('')+'<div class="sig">'+e(a.name)+'</div><div class="sigt">'+e(a.title)+', US Retirement Educators</div></div></div></div></section>';}
  if(a.story&&a.story.length)h+='<section><div class="wrap story"><div><span class="ey">My Story</span><h2>Why I do this work</h2>'+(a.quote?'<blockquote>\u201c'+e(a.quote)+'\u201d</blockquote>':'')+'</div><div class="tx">'+a.story.map(function(p){return '<p>'+e(p)+'</p>';}).join('')+'</div></div></section>';
  if(a.reasons&&a.reasons.length)h+='<section class="alt"><div class="wrap"><span class="ey">Why Families Choose '+first+'</span><h2>What you can count on</h2><div class="reasons">'+a.reasons.map(function(r,i){return '<div class="rs"><div class="rn">0'+(i+1)+'</div><h3>'+e(r[0])+'</h3><p>'+e(r[1])+'</p></div>';}).join('')+'</div></div></section>';
